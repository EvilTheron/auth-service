name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags from the Git tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/eviltheron/auth-service
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Trigger deploy on Render
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set, skipping deployment"
            exit 0
          fi
          curl -fsS -o /dev/null -X POST --get "$DEPLOY_HOOK" \
            --data-urlencode "imgURL=ghcr.io/eviltheron/auth-service:${VERSION#v}"

      - name: Wait until the new version is live
        if: env.DEPLOY_HOOK != '' && env.PUBLIC_URL != ''
        run: |
          expected="${VERSION#v}"
          for _ in $(seq 1 40); do
            live=$(curl -fsS "$PUBLIC_URL/health" | jq -r .version || true)
            if [ "$live" = "$expected" ]; then
              echo "Version $expected is live"
              exit 0
            fi
            echo "Live version: ${live:-unavailable}, waiting for $expected"
            sleep 15
          done
          echo "Version $expected did not go live within 10 minutes"
          exit 1
